<div class="flex min-h-screen flex-col bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <!-- Top Navigation -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/90 backdrop-blur-md dark:border-slate-800 dark:bg-slate-950/90">
    <div class="mx-auto flex h-14 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <div class="flex min-w-0 items-center gap-5">
        <a
          routerLink="/admin/issue-groups"
          class="flex shrink-0 items-center gap-2.5 rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500"
        >
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-sky-600 text-white">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div class="flex flex-col leading-none">
            <span class="text-sm font-semibold tracking-tight text-slate-900 dark:text-slate-50">
              CityPulse
            </span>
            <span class="mt-0.5 text-[10px] font-medium tracking-wide text-slate-500 dark:text-slate-400">
              Civic issue management
            </span>
          </div>
        </a>

        <nav class="hidden items-center gap-0.5 md:flex" aria-label="Primary">
          <a
            routerLink="/admin/issue-groups"
            routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
            [routerLinkActiveOptions]="{ exact: false }"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            Issue Groups
          </a>
          <a
            routerLink="/admin/issue-groups/create"
            routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
            class="rounded-md px-3 py-1.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
          >
            How clustering works
          </a>
        </nav>
      </div>

      <!-- Theme Switcher Controls -->
      <app-theme-toggle />
    </div>
  </header>

  <!-- Nested Route Rendering -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white py-5 dark:border-slate-800 dark:bg-slate-900">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-4 text-xs text-slate-500 sm:flex-row sm:px-6 lg:px-8 dark:text-slate-400">
      <p><span class="font-medium text-slate-700 dark:text-slate-300">CityPulse</span> — municipal issue grouping</p>
      <p>Reports grouped within a 50m radius by the CityPulse backend</p>
    </div>
  </footer>
</div>
