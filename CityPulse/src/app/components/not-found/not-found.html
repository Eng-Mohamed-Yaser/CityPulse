<main class="flex min-h-[calc(100vh-4rem)] items-center justify-center overflow-hidden bg-background px-4 py-16 sm:px-8">
  <div aria-hidden="true" class="pointer-events-none absolute left-1/2 top-1/2 h-[30rem] w-[30rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-primary/10 blur-[120px]"></div>

  <div class="relative z-10 w-full max-w-2xl text-center">
    <div class="glass-panel rounded-3xl p-8 sm:p-12">
      <div class="section-eyebrow">Error code 404</div>
      <p class="mt-6 font-display text-8xl font-extrabold tracking-tight text-primary sm:text-9xl">404</p>
      <h1 class="mt-3 font-display text-2xl font-bold tracking-tight text-content sm:text-3xl">Page not found</h1>
      <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-content-muted sm:text-base">
        The municipal record or page you are looking for does not exist on the platform.
      </p>

      <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
        <a routerLink="/" class="btn-primary w-full sm:w-auto">Return Home</a>
        <a routerLink="/" fragment="report" class="btn-secondary w-full sm:w-auto">Report a broken link</a>
      </div>
    </div>

    <nav class="mt-6 flex items-center justify-center gap-5 text-sm text-content-muted" aria-label="Helpful links">
      <a routerLink="/" fragment="features" class="hover:text-primary">Features</a>
      <a routerLink="/" fragment="about" class="hover:text-primary">About</a>
    </nav>
  </div>
</main>
